schema_version = "1.1"

[task]
name = "labelbox/aerial-manipulator"
description = "Create an Aerial Manipulator MJCF."

[environment]
required_resources = "6vcpu+32gib"
storage_mb = 20000
allow_internet = false

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 300
env = []

[difficulty]
task_type = "mujoco"
domain = "model_environment_construction"
reward_type = "multi_deterministic_rubrics"

[ground_truth]
in_container = true
render_command = "bash /host_task/solution/render.sh"
render_outputs = [
  { path = "/tmp/output/rendering.mp4", required = true, description = "Reviewer video of the oracle aerial manipulator rollout" },
]

[runner]
context_mode = "none"

[[outputs]]
path = "/tmp/output/model.xml"
required = true
description = "MJCF XML model for the aerial manipulator"

[[outputs]]
path = "/tmp/output/rendering.mp4"
required = false
description = "Optional ground-truth reviewer video; agents only need to submit model.xml"
